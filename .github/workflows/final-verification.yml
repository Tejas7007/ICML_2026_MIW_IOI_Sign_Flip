name: Final verification

on:
  push:
    branches: [final-verification]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff
      - name: Syntax and static checks
        run: |
          python -m compileall -q scripts
          ruff check scripts --select E9,F63,F7,F82
      - name: Check every command-line entry point
        run: |
          for script in scripts/make_figures.py scripts/verify_claims.py scripts/reproduce_*.py; do
            echo "Checking $script"
            python "$script" --help >/dev/null
          done
      - name: Verify released claims and package
        run: python scripts/verify_claims.py --verbose
      - name: Regenerate figures
        run: |
          rm -rf /tmp/ioi-sign-flip-figures
          python scripts/make_figures.py --output-dir /tmp/ioi-sign-flip-figures
          test -s /tmp/ioi-sign-flip-figures/fig1_below_chance_dip.pdf
          test -s /tmp/ioi-sign-flip-figures/fig1_below_chance_dip.png
          test -s /tmp/ioi-sign-flip-figures/fig2_sign_flip.pdf
          test -s /tmp/ioi-sign-flip-figures/fig2_sign_flip.png
          test -s /tmp/ioi-sign-flip-figures/fig3_loss_vs_accuracy.pdf
          test -s /tmp/ioi-sign-flip-figures/fig3_loss_vs_accuracy.png
