name: Final submission audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install declared dependencies and audit tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt ruff
          python -m pip check

      - name: Compile every Python file
        run: python -m compileall -q scripts

      - name: Check fatal Python errors
        run: ruff check scripts --select E9,F63,F7,F82

      - name: Smoke-test every public command
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/reproduce_*.py scripts/make_figures.py scripts/verify_claims.py; do
            echo "Checking $script --help"
            python "$script" --help >/dev/null
          done

      - name: Verify all released numerical claims and package files
        run: python scripts/verify_claims.py --verbose

      - name: Regenerate all paper figures
        run: |
          rm -rf /tmp/icml-paper-figures
          python scripts/make_figures.py --output-dir /tmp/icml-paper-figures
          test -s /tmp/icml-paper-figures/fig1_below_chance_dip.pdf
          test -s /tmp/icml-paper-figures/fig1_below_chance_dip.png
          test -s /tmp/icml-paper-figures/fig2_sign_flip.pdf
          test -s /tmp/icml-paper-figures/fig2_sign_flip.png
          test -s /tmp/icml-paper-figures/fig3_loss_vs_accuracy.pdf
          test -s /tmp/icml-paper-figures/fig3_loss_vs_accuracy.png

      - name: Check repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          ! git ls-files | grep -E '(^|/)(__pycache__|\.ipynb_checkpoints|\.DS_Store)(/|$)'
          ! git ls-files | grep -E '\.(pyc|pyo)$'
          ! git ls-files | grep -Ei '(^|/)(tmp|temp|final_final|new_script[0-9]*)(\.|/|$)'
          ! git ls-files '*.ipynb' | grep -q .
          ! grep -RIl --exclude-dir=.git -E '^(<<<<<<<|=======|>>>>>>>)' . | grep -q .
          git diff --exit-code

      - name: Close audit PR and delete temporary branch
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" -f state=closed
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${HEAD_BRANCH}"
