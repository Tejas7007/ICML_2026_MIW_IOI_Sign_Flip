name: External link audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check public links
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 60 --output /dev/null \
            https://github.com/Tejas7007/ICML_2026_MIW_IOI_Sign_Flip
          curl --fail --location --retry 3 --max-time 60 --output /dev/null \
            https://huggingface.co/teys7007/pythia-160m-seed42-dense

      - name: Close audit PR and delete temporary branch
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" -f state=closed
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${HEAD_BRANCH}"
