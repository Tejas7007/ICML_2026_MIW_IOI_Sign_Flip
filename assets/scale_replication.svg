<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial" role="img" aria-label="The sign reversal replicates across all six tested Pythia scales">
  <defs><linearGradient id="sbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/></linearGradient></defs>
  <rect width="820" height="330" rx="10" fill="url(#sbg)"/>
  <text x="34" y="40" fill="#e6edf3" font-size="19" font-weight="700">The reversal replicates across all six tested scales</text>
  <text x="34" y="62" fill="#8b949e" font-size="13">Matched-S2 intervention effect at the floor and at maturity, from 160M to 12B parameters.</text>
  <g transform="translate(60,96)">
    <line x1="360" y1="0" x2="360" y2="196" stroke="#30363d" stroke-width="1"/>
    <text x="360" y="212" fill="#6e7681" font-size="10" text-anchor="middle">0</text>
    <text x="150" y="212" fill="#f85149" font-size="10" text-anchor="middle">intervention harms (-)</text>
    <text x="560" y="212" fill="#3fb950" font-size="10" text-anchor="middle">intervention helps (+)</text>
  </g>
  <g transform="translate(60,104)" font-size="11">
    <g transform="translate(0,4)"><text x="0" y="10" fill="#adbac7" font-weight="600">160M</text><rect x="360" y="2" width="0" height="11" rx="2" fill="#3fb950"><animate attributeName="width" from="0" to="28" begin="0.3s" dur="0.5s" fill="freeze"/></rect><rect x="360" y="2" width="0" height="11" rx="2" fill="#f85149"><animate attributeName="x" from="360" to="236" begin="0.6s" dur="0.6s" fill="freeze"/><animate attributeName="width" from="0" to="124" begin="0.6s" dur="0.6s" fill="freeze"/></rect><text x="392" y="11" fill="#3fb950" opacity="0">+0.95<animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="0.3s" fill="freeze"/></text><text x="228" y="11" fill="#f85149" text-anchor="end" opacity="0">-4.12<animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.3s" fill="freeze"/></text></g>
    <g transform="translate(0,32)"><text x="0" y="10" fill="#adbac7" font-weight="600">410M</text><rect x="360" y="2" width="0" height="11" rx="2" fill="#3fb950"><animate attributeName="width" from="0" to="3" begin="0.5s" dur="0.5s" fill="freeze"/></rect><rect x="360" y="2" width="0" height="11" rx="2" fill="#f85149"><animate attributeName="x" from="360" to="251" begin="0.8s" dur="0.6s" fill="freeze"/><animate attributeName="width" from="0" to="109" begin="0.8s" dur="0.6s" fill="freeze"/></rect><text x="368" y="11" fill="#3fb950" opacity="0">+0.11<animate attributeName="opacity" from="0" to="1" begin="1.0s" dur="0.3s" fill="freeze"/></text><text x="243" y="11" fill="#f85149" text-anchor="end" opacity="0">-3.63<animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="0.3s" fill="freeze"/></text></g>
    <g transform="translate(0,60)"><text x="0" y="10" fill="#adbac7" font-weight="600">1B</text><rect x="360" y="2" width="0" height="11" rx="2" fill="#3fb950"><animate attributeName="width" from="0" to="13" begin="0.7s" dur="0.5s" fill="freeze"/></rect><rect x="360" y="2" width="0" height="11" rx="2" fill="#f85149"><animate attributeName="x" from="360" to="255" begin="1.0s" dur="0.6s" fill="freeze"/><animate attributeName="width" from="0" to="105" begin="1.0s" dur="0.6s" fill="freeze"/></rect><text x="378" y="11" fill="#3fb950" opacity="0">+0.43<animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.3s" fill="freeze"/></text><text x="247" y="11" fill="#f85149" text-anchor="end" opacity="0">-3.49<animate attributeName="opacity" from="0" to="1" begin="1.6s" dur="0.3s" fill="freeze"/></text></g>
    <g transform="translate(0,88)"><text x="0" y="10" fill="#adbac7" font-weight="600">2.8B</text><rect x="360" y="2" width="0" height="11" rx="2" fill="#3fb950"><animate attributeName="width" from="0" to="10" begin="0.9s" dur="0.5s" fill="freeze"/></rect><rect x="360" y="2" width="0" height="11" rx="2" fill="#f85149"><animate attributeName="x" from="360" to="238" begin="1.2s" dur="0.6s" fill="freeze"/><animate attributeName="width" from="0" to="122" begin="1.2s" dur="0.6s" fill="freeze"/></rect><text x="375" y="11" fill="#3fb950" opacity="0">+0.33<animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="0.3s" fill="freeze"/></text><text x="230" y="11" fill="#f85149" text-anchor="end" opacity="0">-4.05<animate attributeName="opacity" from="0" to="1" begin="1.8s" dur="0.3s" fill="freeze"/></text></g>
    <g transform="translate(0,116)"><text x="0" y="10" fill="#adbac7" font-weight="600">6.9B</text><rect x="360" y="2" width="0" height="11" rx="2" fill="#3fb950"><animate attributeName="width" from="0" to="25" begin="1.1s" dur="0.5s" fill="freeze"/></rect><rect x="360" y="2" width="0" height="11" rx="2" fill="#f85149"><animate attributeName="x" from="360" to="236" begin="1.4s" dur="0.6s" fill="freeze"/><animate attributeName="width" from="0" to="124" begin="1.4s" dur="0.6s" fill="freeze"/></rect><text x="389" y="11" fill="#3fb950" opacity="0">+0.84<animate attributeName="opacity" from="0" to="1" begin="1.6s" dur="0.3s" fill="freeze"/></text><text x="228" y="11" fill="#f85149" text-anchor="end" opacity="0">-4.12<animate attributeName="opacity" from="0" to="1" begin="2.0s" dur="0.3s" fill="freeze"/></text></g>
    <g transform="translate(0,144)"><text x="0" y="10" fill="#adbac7" font-weight="600">12B</text><rect x="360" y="2" width="0" height="11" rx="2" fill="#3fb950"><animate attributeName="width" from="0" to="13" begin="1.3s" dur="0.5s" fill="freeze"/></rect><rect x="360" y="2" width="0" height="11" rx="2" fill="#f85149"><animate attributeName="x" from="360" to="241" begin="1.6s" dur="0.6s" fill="freeze"/><animate attributeName="width" from="0" to="119" begin="1.6s" dur="0.6s" fill="freeze"/></rect><text x="378" y="11" fill="#3fb950" opacity="0">+0.43<animate attributeName="opacity" from="0" to="1" begin="1.8s" dur="0.3s" fill="freeze"/></text><text x="233" y="11" fill="#f85149" text-anchor="end" opacity="0">-3.96<animate attributeName="opacity" from="0" to="1" begin="2.2s" dur="0.3s" fill="freeze"/></text></g>
  </g>
</svg>
