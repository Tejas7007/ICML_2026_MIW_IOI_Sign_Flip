<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial" role="img" aria-label="Accessibility, causal dependence, and suppressor function follow different training trajectories">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/>
    </linearGradient>
  </defs>
  <rect width="820" height="320" rx="10" fill="url(#tbg)"/>
  <text x="34" y="40" fill="#e6edf3" font-size="19" font-weight="700">Three measurements follow different training trajectories</text>
  <text x="34" y="62" fill="#8b949e" font-size="13">Linear accessibility, position-level causal dependence, and suppressor function should be kept distinct.</text>

  <g transform="translate(210,92)">
    <line x1="0" y1="180" x2="540" y2="180" stroke="#30363d" stroke-width="1"/>
    <text x="0" y="200" fill="#6e7681" font-size="11">init</text>
    <text x="150" y="200" fill="#f2cc60" font-size="11" text-anchor="middle">window</text>
    <text x="512" y="200" fill="#6e7681" font-size="11">mature</text>
    <text x="228" y="216" fill="#484f58" font-size="10">training step</text>
    <rect x="120" y="-6" width="60" height="186" fill="#f2cc60" opacity="0.06"/>

    <text x="-176" y="26" fill="#79c0ff" font-size="12" font-weight="600">held-out probe</text>
    <line x1="0" y1="22" x2="540" y2="22" stroke="#21262d" stroke-width="6" stroke-linecap="round"/>
    <line x1="0" y1="22" x2="540" y2="22" stroke="#58a6ff" stroke-width="6" stroke-linecap="round" stroke-dasharray="540" stroke-dashoffset="540">
      <animate attributeName="stroke-dashoffset" from="540" to="0" begin="0.4s" dur="2.4s" fill="freeze"/>
    </line>
    <circle cx="150" cy="22" r="5" fill="#58a6ff" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.3s" dur="0.4s" fill="freeze"/></circle>
    <text x="150" y="10" fill="#8b949e" font-size="9" text-anchor="middle" opacity="0">~61%<animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="0.4s" fill="freeze"/></text>

    <text x="-176" y="90" fill="#d2a8ff" font-size="12" font-weight="600">S2 intervention</text>
    <line x1="0" y1="86" x2="540" y2="86" stroke="#21262d" stroke-width="6" stroke-linecap="round"/>
    <line x1="0" y1="86" x2="250" y2="86" stroke="#3fb950" stroke-width="6" stroke-linecap="round" stroke-dasharray="250" stroke-dashoffset="250">
      <animate attributeName="stroke-dashoffset" from="250" to="0" begin="0.4s" dur="1.1s" fill="freeze"/></line>
    <line x1="250" y1="86" x2="540" y2="86" stroke="#f85149" stroke-width="6" stroke-linecap="round" stroke-dasharray="290" stroke-dashoffset="290">
      <animate attributeName="stroke-dashoffset" from="290" to="0" begin="1.5s" dur="1.3s" fill="freeze"/></line>
    <circle cx="250" cy="86" r="5" fill="#e6edf3" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.3s" fill="freeze"/></circle>
    <text x="150" y="74" fill="#3fb950" font-size="9" text-anchor="middle" opacity="0">+0.95<animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.4s" fill="freeze"/></text>
    <text x="470" y="74" fill="#f85149" font-size="9" text-anchor="middle" opacity="0">-4.12<animate attributeName="opacity" from="0" to="1" begin="2.4s" dur="0.4s" fill="freeze"/></text>

    <text x="-176" y="154" fill="#7ee787" font-size="12" font-weight="600">robust suppression</text>
    <line x1="0" y1="150" x2="540" y2="150" stroke="#21262d" stroke-width="6" stroke-linecap="round"/>
    <line x1="420" y1="150" x2="540" y2="150" stroke="#2ea043" stroke-width="6" stroke-linecap="round" stroke-dasharray="120" stroke-dashoffset="120">
      <animate attributeName="stroke-dashoffset" from="120" to="0" begin="2.6s" dur="0.8s" fill="freeze"/></line>
    <circle cx="420" cy="150" r="5" fill="#2ea043" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.6s" dur="0.4s" fill="freeze"/></circle>
    <text x="420" y="140" fill="#8b949e" font-size="9" text-anchor="middle" opacity="0">by step 6000<animate attributeName="opacity" from="0" to="1" begin="2.7s" dur="0.4s" fill="freeze"/></text>
  </g>
</svg>
